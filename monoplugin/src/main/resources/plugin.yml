main: org.konnovk.MonoPlugin

api-version: '1.21.11'

bootstrapper: io.papermc.testplugin.TestPluginBootstrap
loader: io.papermc.testplugin.TestPluginLoader

commands:
  tpa:
    usage: /tpa <player>
  tpaccept:
    usage: /tpaccept
  sethome:
    usage: /sethome [<name>]
